# Manual-only (paused to stop automatic runs and notifications).
# To restore the welcome messages, replace the trigger below with:
#
#   on:
#     fork:
#     push:
#       branches: [main]
#     issues:
#       types: [opened]
#     issue_comment:
#       types: [created]
#     pull_request_target:
#       types: [opened]
#     pull_request_review_comment:
#       types: [created]

on:
  workflow_dispatch:

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v1
      - uses: EddieHubCommunity/gh-action-community/src/welcome@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            <div align="center">
              <h3> It's great having you contribute to this project </h3>
              <h4> 🌟 Welcome to the community 🌟 </h4>
            </div>
          pr-message: |
            <div align="center">
              <h3> It's great having you contribute to this project </h3>
              <h4> 🌟 Welcome to the community 🌟 </h4>
            </div>
          footer: |
            </p>          

            - If you would like to continue contributing to open source and would like to do it with an awesome inclusive community.
            - You should join our [Discord](https://discord.com/invite/thecyberhub-799183504759324672) chat and our [GitHub Organisation](https://github.com/th3cyb3rhub). 
            - We help and encourage each other to contribute to open source little and often 😄.
            - Any questions let us know.

            <p>
